<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>珠心學苑＋課程管理 Demo</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/admin.css?v=20260724-sidebar-fix"><link rel="stylesheet" href="css/design-tokens.css"><link rel="stylesheet" href="css/layout.css?v=20260724-sidebar-fix"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/admin-theme.css?v=20260724-sidebar-fix"></head>
<body>
  <div class="admin-shell"><aside class="sidebar" id="sidebar"><a class="sidebar-brand" href="courses.html"><strong>珠心學苑＋</strong><span>課程管理 Demo</span></a><nav class="sidebar-nav" aria-label="課程管理選單"><a href="#dashboard">儀表板</a><a href="leads.html">招生名單</a><a href="students.html">學生管理</a><a href="teachers.html">老師管理</a><a class="is-active" href="courses.html">課程管理</a><a href="classes.html">班級管理</a><button type="button" data-coming-soon>帳號管理<span>下一階段</span></button><a href="ailead-demo.html">回到招生首頁</a></nav></aside>
  <div class="admin-content"><header class="topbar"><button class="menu-toggle" id="menuToggle" type="button" aria-controls="sidebar" aria-expanded="false">選單</button><div><p class="eyebrow">Course Management</p><h1>珠心學苑＋課程管理 Demo</h1><p class="demo-notice">本頁為求職作品展示。資料僅儲存在目前瀏覽器 localStorage，不包含正式登入或正式資料庫。</p></div></header>
  <main class="admin-main" id="dashboard"><section class="metrics"><article><span id="totalCount">0</span><p>全部課程</p></article><article><span id="activeCount">0</span><p>招生中</p></article><article><span id="draftCount">0</span><p>草稿</p></article><article><span id="archivedCount">0</span><p>已封存</p></article></section>
  <section class="panel"><div class="panel-heading"><div><p class="eyebrow">Courses</p><h2>課程列表</h2></div><div class="panel-actions"><button id="seedDemo" type="button">建立 Demo 範例資料</button><button id="newItem" type="button">新增課程</button><button id="exportCsv" type="button">匯出 CSV</button></div></div>
  <div class="toolbar"><label>搜尋<input id="searchInput" type="search" placeholder="課程名稱、代碼"></label><label>類別<select id="categoryFilter"><option value="">全部類別</option></select></label><label>級別<select id="levelFilter"><option value="">全部級別</option></select></label><label>狀態<select id="statusFilter"><option value="">全部狀態</option></select></label><button id="clearFilters" type="button">清除篩選</button></div>
  <p class="result-count" id="resultCount" aria-live="polite">目前顯示 0 筆</p><div class="table-wrap"><table aria-label="課程列表"><caption>課程資料管理</caption><thead><tr><th>課程編號</th><th>課程名稱</th><th>課程代碼</th><th>類別</th><th>級別</th><th>適合年級</th><th>預設人數</th><th>已開班數</th><th>課程狀態</th><th>操作</th></tr></thead><tbody id="tableBody"></tbody></table></div><div id="emptyState" class="empty-state" hidden><h2>目前沒有課程資料</h2></div><div id="noResultState" class="empty-state" hidden><h2>找不到符合條件的課程。</h2></div></section></main></div></div>
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div><aside class="lead-drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden><form id="itemForm"><div class="drawer-header"><div><p class="eyebrow">Course Detail</p><h2 id="drawerTitle">課程資料</h2></div><button class="icon-button" id="closeDrawer" type="button" aria-label="關閉">×</button></div><div class="drawer-body"><input type="hidden" id="itemId"><section class="detail-section"><div class="form-grid"><label>課程名稱<input id="courseName" required></label><label>課程代碼<input id="courseCode"></label><label>課程類別<select id="category" required></select></label><label>課程級別<select id="level" required></select></label><label>每堂時間<input id="duration" type="number" min="30" max="240" value="90"></label><label>預設班級容量<input id="capacity" type="number" min="1" max="100" value="12"></label><label>課程狀態<select id="courseStatus"></select></label></div><fieldset class="checkbox-field"><legend>適合年級</legend><div id="gradeChecks" class="checkbox-list"></div></fieldset><label>課程介紹<textarea id="description" maxlength="1000" rows="7"></textarea></label><p class="char-note"><span id="descCount">0</span> / 1000</p><p class="form-error" id="formError" aria-live="polite"></p></section></div><div class="drawer-footer"><button type="button" class="secondary-button" id="cancelDrawer">取消</button><button type="submit">儲存</button></div></form></aside>
  <div class="toast" id="liveMessage" aria-live="polite" aria-atomic="true"></div><script src="js/auth.js"></script><script src="js/academic-data.js?v=20260724-academic-data"></script><script src="js/courses.js?v=20260724-auth"></script>
</body></html>
